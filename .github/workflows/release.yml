name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/check.yml

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: bash packaging/archive.sh x86_64-pc-windows-msvc dist
      # TODO: sign klad.exe and klad-editor.exe, then put the archive in the private bucket

  release:
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash packaging/notes.sh "$version" > notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "klad ${GITHUB_REF_NAME#v}" --notes-file notes.md
