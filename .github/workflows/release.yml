name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: A test version with a dash (for example 0.0.0-test.1); the Windows build goes into the bucket under it and releases.json stays as it is
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/check.yml

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - name: The version
        run: |
          version="${VERSION#v}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [[ "$version" != *-* ]]; then
            echo "::error::a run by hand publishes test versions only, with a dash (0.0.0-test.1); a release is a tag v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Windows Defender leaves the build alone
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      - name: Build
        run: |
          set -o pipefail
          bash packaging/archive.sh x86_64-pc-windows-msvc dist | tee built.txt
          echo "STAGE=$(grep -E '\.zip$' built.txt | tail -1 | sed 's/\.zip$//')" >> "$GITHUB_ENV"
      # TODO: sign klad.exe and klad-editor.exe once Windows signing is set up (KLA-529)
      - name: Inno Setup
        run: |
          [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup --version 6.4.3 -y --no-progress
      - name: The installer
        run: |
          set -o pipefail
          bash packaging/windows/setup.sh "$STAGE" dist | tee setup.txt
          echo "SETUP=$(tail -1 setup.txt)" >> "$GITHUB_ENV"
      # TODO: sign the installer too (KLA-529)
      - name: The installer installs, puts klad on the PATH and uninstalls
        run: |
          MSYS_NO_PATHCONV=1 "$SETUP" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          app="$(cygpath -u "$LOCALAPPDATA")/Programs/klad"
          "$app/klad.exe" --version
          test -f "$app/klad-editor.exe"
          test -f "$app/fonts/fonts.json"
          test -d "$app/samples"
          path="$(MSYS_NO_PATHCONV=1 reg query 'HKCU\Environment' /v Path || true)"
          grep -qi 'Programs\\klad' <<<"$path"
          MSYS_NO_PATHCONV=1 "$app/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES
          for _ in $(seq 60); do [ -e "$app/klad.exe" ] || break; sleep 1; done
          [ ! -e "$app/klad.exe" ]
          path="$(MSYS_NO_PATHCONV=1 reg query 'HKCU\Environment' /v Path || true)"
          ! grep -qi 'Programs\\klad' <<<"$path"
      - name: Into the bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash packaging/publish.sh "$VERSION" windows "$SETUP"

  release:
    needs: windows
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash packaging/notes.sh "$version" > notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "klad ${GITHUB_REF_NAME#v}" --notes-file notes.md
