name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      systems:
        description: Which systems
        type: choice
        options: [all, macOS, Linux, Windows]
        default: all
      tests:
        description: Only the tests whose names hold one of these words (empty runs every test and the release build)
        type: string
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  tests:
    name: ${{ matrix.system }} tests
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON((inputs.systems == '' || inputs.systems == 'all') && '["macOS","Linux","Windows"]' || format('["{0}"]', inputs.systems)) }}
    runs-on: ${{ fromJSON('{"macOS":"macos-latest","Linux":"ubuntu-24.04","Windows":"windows-latest"}')[matrix.system] }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ fromJSON('{"macOS":"target","Linux":"target/linux","Windows":"target/windows"}')[matrix.system] }}
      TESTS: ${{ inputs.tests }}
    steps:
      - uses: actions/checkout@v5
      - name: Windows Defender leaves the build alone
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: The Linux packages the README lists
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfreetype-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
          workspaces: ". -> ${{ env.CARGO_TARGET_DIR }}"
      - name: The tests
        run: |
          set -o pipefail
          cargo nextest run --workspace --profile ci $TESTS 2>&1 | tee tests.log
      - name: Say what happened
        if: always()
        run: |
          py=python3
          [ "$RUNNER_OS" != Windows ] || py=python
          "$py" .github/tests-report.py "${{ matrix.system }}" target/nextest/ci/junit.xml tests.log

  release:
    name: ${{ matrix.system }} release build
    if: inputs.tests == ''
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON((inputs.systems == '' || inputs.systems == 'all') && '["macOS","Linux","Windows"]' || format('["{0}"]', inputs.systems)) }}
    runs-on: ${{ fromJSON('{"macOS":"macos-latest","Linux":"ubuntu-24.04","Windows":"windows-latest"}')[matrix.system] }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ fromJSON('{"macOS":"target","Linux":"target/linux","Windows":"target/windows"}')[matrix.system] }}
    steps:
      - uses: actions/checkout@v5
      - name: Windows Defender leaves the build alone
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: The Linux packages the README lists
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfreetype-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          workspaces: ". -> ${{ env.CARGO_TARGET_DIR }}"
      - name: just compile, as the README says
        run: |
          set -o pipefail
          just compile 2>&1 | tee compile.log
      - name: Paint and render a stroke with the build
        run: |
          set -o pipefail
          klad="$CARGO_TARGET_DIR/release/klad"
          {
            "$klad" new smoke.klad --width 400 --height 300
            "$klad" stroke smoke.klad l1 --brush oil --size 20 --color '#d4612c' --path 'M40 150 C 140 40 260 260 360 150'
            "$klad" render smoke.klad --out smoke.png
            "$klad" skill drawing > skill.txt
            head -n 2 skill.txt
          } 2>&1 | tee smoke.log
      - name: The main stack klad was linked with
        if: runner.os == 'Windows'
        run: |
          exe="$CARGO_TARGET_DIR/release/klad.exe"
          reserve="$(python -c "import struct, sys; b = open(sys.argv[1], 'rb').read(4096); o = struct.unpack_from('<I', b, 0x3c)[0]; print(struct.unpack_from('<Q', b, o + 96)[0])" "$exe")"
          echo "::notice title=Windows main stack::$exe is linked with $reserve bytes"
      - name: Say what happened
        if: failure()
        run: |
          for log in compile smoke; do
            [ -f "$log.log" ] || continue
            { grep -m 6 -E "^error|panicked at" "$log.log" || true; } | while read -r line; do
              echo "::error title=${{ matrix.system }} $log::$line"
            done
          done
