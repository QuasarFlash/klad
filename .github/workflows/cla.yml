name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-24.04
    steps:
      - if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/klad-app/klad/blob/main/CLA.md
          branch: cla-signatures
          allowlist: quantumwhisker,Indicode,Indicode BV,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: "Thank you for this pull request. Before it can be merged, please sign klad's [contributor licence agreement](https://github.com/klad-app/klad/blob/main/CLA.md). It lets Indicode include your change in klad and in the builds it sells, and you keep the copyright to your work. Reply to this pull request with the sentence below; it covers every pull request you send after this one too."
          custom-allsigned-prcomment: "Everyone in this pull request has signed the contributor licence agreement. Thank you."
