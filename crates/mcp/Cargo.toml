[package]
name = "klad-mcp"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish = false
repository.workspace = true
description = "klad as an MCP server: agent apps such as Claude Desktop and Codex paint and edit klad drawings"
keywords = ["klad", "drawing", "mcp", "agent"]
categories = ["graphics"]

[dependencies]
klad-client = { path = "../client" }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-std", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1"
toml_edit = "0.25.17"
